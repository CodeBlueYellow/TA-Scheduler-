{% extends "base.html" %}

{% block title %}Users{% endblock %}

{% block content %}

<div class="page-head">
    <h1>Users</h1>
    <a class="btn secondary" href="{{ url_for('users') }}">Refresh</a>
</div>

<section class="card">

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Username</th>
                <th>Contact</th>
                <th>Role</th>
            </tr>
        </thead>

        <tbody>
            {% for user in users %}
            <tr>
                <td data-label="ID">{{ user[0] }}</td>
                <td data-label="Name">{{ user[1] }}</td>
                <td data-label="Username">{{ user[2] }}</td>
                <td data-label="Contact">{{ user[3] }}</td>
                <td data-label="Role">{{ user[4] }}</td>
            </tr>
            {% endfor %}
        </tbody>

    </table>

</section>

{% endblock %}
