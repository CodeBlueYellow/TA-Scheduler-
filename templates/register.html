<!DOCTYPE html>
<html>
<head>
    <title>TA Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="nav">
        <a href="{{ url_for('login') }}">Back to Login</a>
    </div>

    <h1>Create TA Account</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input type="text" name="name" placeholder="Full Name" required>

        <input type="text" name="username" placeholder="Username" required>

        <input type="email" name="contact" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password (8+ characters)" minlength="8" required>

        <input type="text" name="join_code" placeholder="Join Code (from your professor)" required>

        <button type="submit">Create Account</button>

    </form>

</div>

</body>
</html>
