{% extends "base.html" %}

{% block title %}TA Registration{% endblock %}

{% block topbar %}{% endblock %}

{% block content %}

<section class="auth-card">

    <div class="auth-head">
        <h1>Create TA Account</h1>
    </div>

    <div class="auth-body">

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <input type="text" name="name" placeholder="Full Name" required>

            <input type="text" name="username" placeholder="Username" required>

            <input type="email" name="contact" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password (8+ characters)" minlength="8" required>

            <input type="text" name="join_code" placeholder="Join Code (from your professor)" required>

            <button type="submit">Create Account</button>

        </form>

        <p><a href="{{ url_for('login') }}">Back to Login</a></p>

    </div>

</section>

{% endblock %}
