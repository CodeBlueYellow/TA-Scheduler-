<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>TA Scheduler Login</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <select name="role" required>
            <option value="TA">TA</option>
            <option value="Admin">Admin</option>
        </select>

        <button type="submit">Login</button>

    </form>

    <p>New TA? <a href="{{ url_for('register') }}">Create an account</a></p>

</div>

</body>
</html>
