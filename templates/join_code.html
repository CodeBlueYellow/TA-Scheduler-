{% extends "base.html" %}

{% block title %}Join Code{% endblock %}

{% block content %}

<h1>TA Join Code</h1>

<section class="card narrow">

    <p>Current code: <strong>{{ join_code }}</strong></p>
    <p>Give this code to your TAs so they can create an account.</p>

    {% if message %}
    <p>{{ message }}</p>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input type="text" name="join_code" placeholder="New join code" required>

        <button type="submit">Update Join Code</button>

    </form>

</section>

{% endblock %}
