{% extends "base.html" %}

{% block title %}Schedules{% endblock %}

{% block content %}

<h1>Schedules</h1>

<section class="card">

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Shifts</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            {% for schedule in schedules %}
            <tr>
                <td data-label="Name"><a href="{{ url_for('ta_schedule', schedule_id=schedule[0]) }}">{{ schedule[1] }}</a></td>
                <td data-label="Shifts">{{ schedule[2] }}</td>
                <td data-label="Status"><span class="badge {{ schedule[3] }}">{{ status_labels[schedule[3]] }}</span></td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">No schedules have been published yet.</td>
            </tr>
            {% endfor %}
        </tbody>

    </table>

</section>

{% endblock %}
